[project]
name = "monica-next-api"
version = "0.1.0"
description = "FastAPI backend for Monica Next CRM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
  "pyotp>=2.9,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "zstandard>=0.23,<1",
  "geonamescache>=3.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

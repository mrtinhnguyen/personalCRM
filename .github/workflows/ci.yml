name: CI and container builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Public content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-public.py

  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm-test
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crm -d crm_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://crm:crm-test@localhost:5432/crm_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Sync Python environment
        working-directory: services/api
        run: uv sync --locked

      - name: Ruff check
        working-directory: services/api
        run: uv run ruff check app tests ../../importers

      - name: Run API tests
        working-directory: services/api
        run: uv run pytest -q

  web:
    name: Web lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type check
        run: npm run lint:web

      - name: Build Next.js application
        run: npm run build:web

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

  containers:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
          - service: worker
            dockerfile: services/worker/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: monica-next-${{ matrix.service }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/monica-next-${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Upload deployable image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/monica-next-${{ matrix.service }}.tar
          retention-days: 7
          compression-level: 1

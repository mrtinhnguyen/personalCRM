services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: monica-next-api:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      RAW_ROOT: /data/raw
      MEDIA_ROOT: /data/media
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      IMPORT_HMAC_SECRET: ${IMPORT_HMAC_SECRET:-change-me-in-production}
      IMPORT_HMAC_SECRETS: ${IMPORT_HMAC_SECRETS:-}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ${DATA_ROOT:-./volumes/data}/raw:/data/raw
      - ${DATA_ROOT:-./volumes/data}/media:/data/media
      - ${DATA_ROOT:-./volumes/data}/staging:/data/staging
      - ${DATA_ROOT:-./volumes/data}/exports:/data/exports
      - ${CHATLOG_CACHE_ROOT:-./volumes/sns-cache}:/data/sns-cache:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: monica-next-api:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["uv", "run", "python", "-m", "app", "migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      RAW_ROOT: /data/raw
      MEDIA_ROOT: /data/media
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      IMPORT_HMAC_SECRET: ${IMPORT_HMAC_SECRET:-change-me-in-production}
      IMPORT_HMAC_SECRETS: ${IMPORT_HMAC_SECRETS:-}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ${DATA_ROOT:-./volumes/data}/raw:/data/raw
      - ${DATA_ROOT:-./volumes/data}/media:/data/media
      - ${DATA_ROOT:-./volumes/data}/staging:/data/staging
      - ${DATA_ROOT:-./volumes/data}/exports:/data/exports
      - ${CHATLOG_CACHE_ROOT:-./volumes/sns-cache}:/data/sns-cache:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  linkedin-sync:
    image: monica-next-api:${IMAGE_TAG:-ci}
    command: ["uv", "run", "python", "-m", "app.sync_linkedin", "--source", "/data/raw/linkedin/linkedin_enrichment.incoming.json", "--watch"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      RAW_ROOT: /data/raw
      MEDIA_ROOT: /data/media
    volumes:
      - ${DATA_ROOT:-./volumes/data}/raw:/data/raw
      - ${DATA_ROOT:-./volumes/data}/media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  archive-sync:
    image: monica-next-api:${IMAGE_TAG:-ci}
    command: ["uv", "run", "python", "-m", "app.sync_archives"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      RAW_ROOT: /data/raw
      MEDIA_ROOT: /data/media
      ARCHIVE_SYNC_SECONDS: "21600"
    volumes:
      - ${DATA_ROOT:-./volumes/data}/raw:/data/raw
      - ${DATA_ROOT:-./volumes/data}/media:/data/media
      - ${DATA_ROOT:-./volumes/data}/staging:/data/staging
      - ${CHATLOG_DB_ROOT:-./volumes/chatlog}:/data/chatlog:ro
      - ${CHATLOG_CACHE_ROOT:-./volumes/sns-cache}:/data/sns-cache:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: monica-next-worker:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      MEDIA_ROOT: /data/media
    volumes:
      - ${DATA_ROOT:-./volumes/data}/media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    image: monica-next-web:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    depends_on:
      - api
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      CRM_SCHEME: ${CRM_SCHEME:-http}
      CRM_HOST: ${CRM_HOST:-localhost}
      CRM_TAILSCALE_HOST: ${CRM_TAILSCALE_HOST:-crm.example.ts.net}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CERT_ROOT:-./volumes/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
